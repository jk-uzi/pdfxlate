name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: windows-latest
    defaults:
      run:
        working-directory: python
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check ..

      - name: Test
        run: python -m pytest ../tests -q

  node:
    name: Node
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci
        env:
          # Typecheck and the static build never start Electron, so the ~100 MB
          # runtime download would only slow the job down.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test:frontend

      - name: i18n
        run: npm run check:i18n

      - name: Build
        run: npm run build
