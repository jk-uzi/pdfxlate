<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `frame-src file:` is required by the PDF preview: the built-in viewer
      loads the document from a file:// URL. With `default-src 'none'` the
      frame falls back to 'none' and is blocked outright. Only local files are
      permitted — no remote origins, and script-src stays 'self'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-src file:;"
    />
    <title>pdfxlate</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      The app's own title bar. The OS title bar and menu are hidden (see
      main.ts); the native window buttons are painted by the OS in the
      top-right, so the open tabs stop short of that reserved strip.

      The mark doubles as the sidebar toggle. It sits beside the drag strip
      rather than inside it: a drag region swallows clicks silently, so an
      interactive element placed within one would look present and do nothing.
      The tabs after the strip are siblings of it for the same reason.

      Tabs live here rather than in a row of their own so the document gets
      that height back — the same reason the view controls used to sit here.
    -->
    <header class="titlebar">
      <button
        id="btn-toggle-sidebar"
        class="titlebar__icon"
        data-i18n-title="titlebar.toggleSidebar"
        data-i18n-aria-label="titlebar.toggleSidebar"
        aria-expanded="true"
      >
        <!-- icon-inline -->
      </button>

      <!-- Populated from the open documents; empty until one is opened, in
           which case it takes no width and the drag strip spans the bar. -->
      <div class="tabbar" id="tabbar"></div>

      <div class="titlebar__drag"></div>
    </header>

    <div class="workspace">
      <!-- Task sidebar: collapsible groups, actions pinned at the bottom -->
      <aside class="sidebar" id="sidebar-task">
        <div class="sidebar__scroll">
          <!-- First-run asset setup -->
          <section id="setup-banner" class="banner hidden">
            <div class="banner__text" data-i18n-html="setup.text"></div>
            <button id="btn-download-assets" class="btn btn--primary" data-i18n="setup.download"></button>
          </section>

          <details class="group" id="group-docs" open>
            <summary class="group__head" data-i18n="docs.title"></summary>
            <div class="group__body">
              <button id="btn-pick-folder" class="btn btn--block" data-i18n="docs.pickFolder"></button>
              <p id="folder-label" class="folder-label" data-i18n="docs.noFolder"></p>
              <ul id="file-list" class="file-list"></ul>
            </div>
          </details>

          <details class="group" id="group-options">
            <summary class="group__head" data-i18n="options.title"></summary>
            <div class="group__body">
              <div class="grid grid--one">
                <!--
                  These four change the next job only. The stored defaults live
                  in Settings, so each one opens on a "follow the default" entry
                  rather than a concrete value: showing a model name here would
                  imply this is where the model is chosen for good.
                -->
                <label>
                  <span data-i18n="options.model"></span>
                  <select id="opt-model"></select>
                </label>
                <label>
                  <span data-i18n="options.reasoning"></span>
                  <select id="opt-reasoning">
                    <option value="" data-i18n="options.followDefault"></option>
                    <option value="low" data-i18n="model.reasoningLow"></option>
                    <option value="medium" data-i18n="model.reasoningMedium"></option>
                    <option value="high" data-i18n="model.reasoningHigh"></option>
                  </select>
                </label>
                <label>
                  <span data-i18n="options.langIn"></span>
                  <select id="opt-lang-in"></select>
                </label>
                <label>
                  <span data-i18n="options.langOut"></span>
                  <select id="opt-lang-out"></select>
                </label>
                <label>
                  <span data-i18n="options.mode"></span>
                  <select id="field-mode">
                    <option value="fast" data-i18n="options.modeFast"></option>
                    <option value="ultrafast" data-i18n="options.modeUltrafast"></option>
                  </select>
                </label>
                <label>
                  <span data-i18n="options.threads"></span>
                  <input id="field-thread" type="number" min="1" max="64" value="4" />
                </label>
                <label>
                  <span data-i18n="options.pages"></span>
                  <input id="field-pages" type="text" placeholder="1,3-5" />
                </label>
                <label>
                  <span data-i18n="options.output"></span>
                  <div class="row row--tight">
                    <input id="field-output" type="text" readonly />
                    <button id="btn-pick-output" class="btn btn--small">…</button>
                  </div>
                </label>
              </div>
            </div>
          </details>
        </div>

        <!-- Pinned: stays reachable however long the groups get. -->
        <div class="sidebar__actions">
          <div class="sidebar__actions-row">
            <button id="btn-translate" class="btn btn--primary grow" disabled data-i18n="options.translate"></button>
            <button id="btn-cancel" class="btn btn--danger hidden" data-i18n="options.cancel"></button>
          </div>

          <!--
            Progress shares this row with the settings button: the bar takes the
            width it needs and Settings collapses to a single icon. The bar
            itself has no visible label, so the text line sits under the row.
          -->
          <div class="sidebar__status">
            <div class="progress">
              <div id="progress-bar" class="progress__bar"></div>
            </div>
            <button
              id="btn-open-settings"
              class="btn btn--icon"
              data-i18n-title="settings.open"
              data-i18n-aria-label="settings.open"
            >
              <svg class="icon-gear" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <!--
                  A gear: a thick-stroked circle (which yields both the body and
                  the centre hole from one element) plus eight short teeth.
                  Drawn with `currentColor` so it follows the theme — an inline
                  SVG is part of the document and inherits `color`, which an
                  <img> reference could not. The teeth are deliberately stubby:
                  thin strokes turn to mush at the 18px this renders at.
                -->
                <circle cx="12" cy="12" r="5.2" fill="none" stroke="currentColor" stroke-width="4" />
                <g fill="currentColor">
                  <rect x="10.9" y="0.6" width="2.2" height="4.6" rx="1.1" />
                  <rect x="10.9" y="0.6" width="2.2" height="4.6" rx="1.1" transform="rotate(45 12 12)" />
                  <rect x="10.9" y="0.6" width="2.2" height="4.6" rx="1.1" transform="rotate(90 12 12)" />
                  <rect x="10.9" y="0.6" width="2.2" height="4.6" rx="1.1" transform="rotate(135 12 12)" />
                  <rect x="10.9" y="0.6" width="2.2" height="4.6" rx="1.1" transform="rotate(180 12 12)" />
                  <rect x="10.9" y="0.6" width="2.2" height="4.6" rx="1.1" transform="rotate(225 12 12)" />
                  <rect x="10.9" y="0.6" width="2.2" height="4.6" rx="1.1" transform="rotate(270 12 12)" />
                  <rect x="10.9" y="0.6" width="2.2" height="4.6" rx="1.1" transform="rotate(315 12 12)" />
                </g>
              </svg>
            </button>
          </div>
          <p id="progress-text" class="sidebar__status-text" data-i18n="progress.idle"></p>
        </div>
      </aside>

      <!-- Settings sidebar: a menu; the matching panel renders on the right -->
      <aside class="sidebar hidden" id="sidebar-settings">
        <div class="sidebar__scroll">
          <button id="btn-close-settings" class="btn btn--quiet" data-i18n="settings.back"></button>
          <nav class="settings-menu">
            <button class="settings-menu__item is-active" data-section="model" data-i18n="settings.sectionModel"></button>
            <button class="settings-menu__item" data-section="appearance" data-i18n="settings.sectionAppearance"></button>
            <button class="settings-menu__item" data-section="general" data-i18n="settings.sectionGeneral"></button>
          </nav>
        </div>
      </aside>

      <!--
        Drag to set the sidebar's width. A separate element rather than a CSS
        handle on the sidebar so it is a sibling in the flex row: an absolutely
        positioned handle would be clipped when the sidebar slides away, and
        this one is hidden explicitly instead (see style.css).
      -->
      <div
        class="sidebar__resizer"
        id="sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
        data-i18n-title="sidebar.resize"
        data-i18n-aria-label="sidebar.resize"
      ></div>

      <!-- Preview / settings detail -->
      <section class="preview" id="preview-pane">
        <div id="preview-host" class="preview__host">
          <div id="preview-empty" class="preview__empty">
            <p class="preview__empty-title" data-i18n="preview.emptyTitle"></p>
            <p class="preview__empty-hint" data-i18n="preview.emptyHint"></p>
          </div>

          <!--
            Fit mode, top-left. Two icons rather than the labelled pair that
            used to sit in the title bar: at this size an icon says as much, and
            the labelled pair was the widest thing in a crowded bar.

            Same chip and same reveal rules as the other two overlays. The outer
            frame is a page outline; the arrows inside show which axis is fitted,
            so the same drawing rotated reads as "fit height".
          -->
          <div class="viewer-fit" id="viewer-fit">
            <button
              id="fit-width"
              class="icon-btn fit-icon"
              data-i18n-title="preview.fitWidth"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="5.2" y="2.6" width="13.6" height="18.8" rx="1.9"
                      fill="none" stroke="currentColor" stroke-width="1.7" />
                <g stroke="currentColor" stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round" fill="none">
                  <path d="M7.4 12h9.2" />
                  <path d="M9.6 9.9 7.5 12l2.1 2.1" />
                  <path d="M14.4 9.9 16.5 12l-2.1 2.1" />
                </g>
              </svg>
            </button>
            <button
              id="fit-height"
              class="icon-btn fit-icon"
              data-i18n-title="preview.fitHeight"
              disabled
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <rect x="5.2" y="2.6" width="13.6" height="18.8" rx="1.9"
                      fill="none" stroke="currentColor" stroke-width="1.7" />
                <!-- Only the arrows rotate: the page outline stays upright. -->
                <g stroke="currentColor" stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round" fill="none" transform="rotate(90 12 12)">
                  <path d="M7.4 12h9.2" />
                  <path d="M9.6 9.9 7.5 12l2.1 2.1" />
                  <path d="M14.4 9.9 16.5 12l-2.1 2.1" />
                </g>
              </svg>
            </button>
          </div>

          <!--
            Paging, zoom and "open" hover in the bottom-right corner of the
            document instead of occupying a bar: they are occasional actions,
            and a permanent bar costs height on every page.

            It fades out but keeps its box, so `:hover` still reaches it — an
            element at `opacity: 0` still receives pointer events, which avoids
            needing a separate invisible hot zone. `flashViewerOverlay()` in
            app.ts also reveals it whenever the page changes.

            Inset from the edges rather than flush: the viewer's own scrollbar
            runs down the far right, and covering its lower end would make it
            hard to grab.
          -->
          <div class="viewer-overlay" id="viewer-overlay">
            <div class="pager">
              <button id="page-prev" class="icon-btn" data-i18n-title="preview.prevPage" disabled>‹</button>
              <span id="page-label" class="pager__label">–</span>
              <button id="page-next" class="icon-btn" data-i18n-title="preview.nextPage" disabled>›</button>
            </div>

            <div class="pager">
              <button id="zoom-out" class="icon-btn" data-i18n-title="preview.zoomOut" disabled>−</button>
              <span id="zoom-label" class="pager__label">–</span>
              <button id="zoom-in" class="icon-btn" data-i18n-title="preview.zoomIn" disabled>+</button>
            </div>

            <button id="btn-open-file" class="icon-btn" data-i18n-title="preview.openFile" disabled>↗</button>
          </div>

          <!--
            "Save a copy" for whichever document is on screen. Top-right rather
            than with the paging controls: it acts on the document, not on the
            view. Hidden until wanted, like the overlay below it.
          -->
          <div class="viewer-saveas" id="viewer-saveas">
            <button id="btn-save-as" class="icon-btn" data-i18n-title="preview.saveAs" disabled>⤓</button>
          </div>
        </div>

        <!-- Settings detail: shown instead of the preview while in settings -->
        <div id="settings-host" class="settings-host hidden">
          <section class="settings-panel" data-panel="model">
            <h2 class="settings-panel__title" data-i18n="settings.sectionModel"></h2>

            <h3 class="subhead" data-i18n="model.providerSection"></h3>
            <div class="grid grid--one">
              <label>
                <span data-i18n="model.providerName"></span>
                <select id="provider-select"></select>
              </label>
              <label>
                <span data-i18n="model.kind"></span>
                <input id="field-kind" type="text" placeholder="openai_compat" />
              </label>
              <label>
                <span data-i18n="model.baseUrl"></span>
                <input id="field-base-url" type="text" placeholder="https://api.example.com/v1" />
              </label>
              <label>
                <span data-i18n="model.apiKey"></span>
                <input
                  id="field-api-key"
                  type="password"
                  data-i18n-placeholder="model.apiKeyPlaceholder"
                />
              </label>
            </div>
            <div class="row">
              <input
                id="new-provider-name"
                type="text"
                class="grow"
                data-i18n-placeholder="model.newProviderPlaceholder"
              />
              <button id="btn-add-provider" class="btn btn--small" data-i18n="model.add"></button>
              <button
                id="btn-remove-provider"
                class="btn btn--small btn--danger"
                data-i18n="model.remove"
              ></button>
            </div>

            <h3 class="subhead" data-i18n="model.modelSection"></h3>
            <div class="grid grid--one">
              <label>
                <span data-i18n="model.modelName"></span>
                <select id="model-select"></select>
              </label>
              <label>
                <span data-i18n="model.modelId"></span>
                <input id="field-model-id" type="text" placeholder="model-name" />
              </label>
              <label>
                <span data-i18n="model.reasoning"></span>
                <select id="field-reasoning">
                  <option value="" data-i18n="model.reasoningDefault"></option>
                  <option value="low" data-i18n="model.reasoningLow"></option>
                  <option value="medium" data-i18n="model.reasoningMedium"></option>
                  <option value="high" data-i18n="model.reasoningHigh"></option>
                </select>
              </label>
              <label>
                <span data-i18n="model.temperature"></span>
                <input id="field-temperature" type="number" step="0.1" min="0" max="2" value="0" />
              </label>
              <label>
                <span data-i18n="model.extraBody"></span>
                <input
                  id="field-extra-body"
                  type="text"
                  placeholder='{"chat_template_kwargs":{"enable_thinking":true}}'
                />
              </label>
            </div>
            <div class="row">
              <input
                id="new-model-name"
                type="text"
                class="grow"
                data-i18n-placeholder="model.newModelPlaceholder"
              />
              <button id="btn-add-model" class="btn btn--small" data-i18n="model.add"></button>
              <button
                id="btn-remove-model"
                class="btn btn--small btn--danger"
                data-i18n="model.remove"
              ></button>
            </div>

            <div class="row">
              <button id="btn-save-model" class="btn" data-i18n="model.save"></button>
              <span id="model-msg" class="msg"></span>
            </div>
          </section>

          <section class="settings-panel hidden" data-panel="appearance">
            <h2 class="settings-panel__title" data-i18n="settings.sectionAppearance"></h2>
            <div class="grid grid--one">
              <label>
                <span data-i18n="settings.language"></span>
                <select id="locale-select" data-i18n-aria-label="status.localeLabel"></select>
              </label>
            </div>
          </section>

          <section class="settings-panel hidden" data-panel="general">
            <h2 class="settings-panel__title" data-i18n="settings.sectionGeneral"></h2>
            <dl class="facts">
              <dt data-i18n="settings.engineStatus"></dt>
              <dd><span id="engine-status" class="status status--pending" data-i18n="status.starting"></span></dd>
              <dt data-i18n="settings.version"></dt>
              <dd id="engine-version">–</dd>
              <dt data-i18n="settings.configDir"></dt>
              <dd id="engine-config-dir">–</dd>
            </dl>

            <!--
              The engine log lives here rather than in the task sidebar: it is
              the only sink for the engine's stderr stream and for every failure
              path in app.ts, so it has to stay reachable, and read-only
              diagnostics is what this panel already is. The `log-pane` id is
              unchanged, so `appendLog` needs no change to find it.
            -->
            <h3 class="subhead" data-i18n="settings.logTitle"></h3>
            <pre id="log-pane"></pre>
          </section>
        </div>
      </section>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
