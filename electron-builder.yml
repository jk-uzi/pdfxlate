appId: com.pdfxlate.app
productName: pdfxlate
copyright: Copyright © 2026 pdfxlate contributors

directories:
  output: dist
  buildResources: build

# The app mark. Kept in `assets/` rather than the conventional `build/` because
# `.gitignore` excludes `build/` as packaging output, and the icon is source
# that has to be committed. Generated from src/renderer/icon.svg by
# scripts/make_icon.py, which is also what the title bar shows.
icon: assets/icon.png

files:
  - out/**/*
  - package.json

# The PyInstaller onedir output is bundled as a resource directory and located
# at runtime via process.resourcesPath (see src/main/sidecar.ts).
extraResources:
  - from: python/dist/pdfxlate-sidecar
    to: sidecar
    filter:
      - "**/*"

# --- Linux -----------------------------------------------------------------
linux:
  target:
    - AppImage
  category: Office
  synopsis: Translate PDF documents while preserving their layout

# --- Windows ---------------------------------------------------------------
win:
  target:
    - nsis
  # An .ico is supplied rather than letting electron-builder convert the PNG:
  # the conversion path is not exercised here, and the multi-size container is
  # generated anyway by scripts/make_icon.py.
  icon: assets/icon.ico
  # Code signing is intentionally omitted: it requires a purchased certificate.
  # Unsigned builds trigger a SmartScreen warning on first run.
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

# --- macOS -----------------------------------------------------------------
mac:
  target:
    - dmg
  category: public.app-category.productivity
  # Unsigned builds are blocked by Gatekeeper; notarisation needs a Developer
  # ID certificate. Remove the line below once signing is configured.
  identity: null
  hardenedRuntime: false
