[project]
name = "pdfxlate"
version = "0.1.0"
description = "Layout-preserving PDF translation with any OpenAI-compatible model"
requires-python = ">=3.11,<3.13"
dependencies = [
    # --- PDF parsing and typesetting --------------------------------
    # Pinned: the ported interpreter uses pdfminer internals (pdftypes,
    # psparser, pdfcolor, pdffont).  A version bump has repeatedly broken
    # the content-stream round-trip, so this is pinned on purpose.
    "pdfminer-six==20250416",
    # Pinned to match the upstream layout/font behaviour this was ported from.
    "pymupdf<1.25.3",
    # --- Layout detection (ONNX DocLayout-YOLO) ---------------------
    "onnx",
    "onnxruntime",
    "opencv-python-headless",
    "numpy",
    # --- Translation backends --------------------------------------
    "openai>=1.0.0",
    "tenacity",
    # --- Infrastructure --------------------------------------------
    "requests",
    "pyyaml",
    "pydantic>=2",
    "tqdm",
    "rich",
    # Required at runtime by PyMuPDF's Document.subset_fonts().  It is not a
    # direct import anywhere in the source, so it is easy to miss, but font
    # subsetting fails hard without it.
    "fonttools",
]

[project.optional-dependencies]
# Native-text heuristic layout, skips the ONNX model entirely.
ultrafast = ["pdf-inspector>=1.25.2,<2"]
cuda = ["onnxruntime-gpu"]
# Expose the translator to a coding agent over MCP.  Kept out of the core
# dependencies on purpose: mcp 2.x pulls in starlette, uvicorn, pyjwt and
# cryptography, and the desktop bundle is already ~253 MB without them.  Only
# users who wire the server into an agent need this extra.
mcp = ["mcp>=2.3.0"]
dev = ["pytest", "pyinstaller"]

[project.scripts]
pdfxlate = "pdfxlate.cli:main"
pdfxlate-sidecar = "pdfxlate.sidecar:main"
pdfxlate-mcp = "pdfxlate.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdfxlate"]
